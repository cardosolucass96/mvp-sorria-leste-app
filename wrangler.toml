#:schema node_modules/wrangler/config-schema.json

name = "sorria-leste-app"
account_id = "d603948925acaef083c8eafe1a05c2c4"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Diretório de assets estáticos
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Binding do D1 Database
[[d1_databases]]
binding = "DB"
database_name = "sorria-leste-db"
database_id = "1a32c7e9-c5e7-4c53-89f0-3169d2ba7e4f"

# Binding do R2 Bucket para arquivos
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sorria-leste-arquivos"

# Self-reference para middleware
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "sorria-leste-app"

# Configuração para desenvolvimento local
[dev]
port = 8788

# Variáveis de ambiente
[vars]
ENVIRONMENT = "production"
GOOGLE_CALENDAR_ENABLED = "true"
GOOGLE_APP_BASE_URL = "https://app.sorrialeste.com.br"

# Observabilidade
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Validação da modularização, independente da V2 em staging.
[env.refactor]
name = "sorria-leste-app-refactor"

[env.refactor.vars]
ENVIRONMENT = "refactor"
EXTERNAL_SIDE_EFFECTS_ENABLED = "false"
APP_BASE_URL = "https://sorria-leste-app-refactor.lucas-cardoso.workers.dev"

[[env.refactor.d1_databases]]
binding = "DB"
database_name = "sorria-leste-db-refactor"
database_id = "8d29206a-83fb-4874-bbfa-182ee25436aa"

[[env.refactor.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sorria-leste-arquivos-refactor"

[[env.refactor.services]]
binding = "WORKER_SELF_REFERENCE"
service = "sorria-leste-app-refactor"

[env.refactor.version_metadata]
binding = "CF_VERSION_METADATA"
